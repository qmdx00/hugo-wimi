name: build

on:
  push:
  pull_request:

jobs:
  exampleSite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.166.0"
      - name: Build exampleSite
        run: hugo --source exampleSite --themesDir "$(dirname "$PWD")" --minify --destination /tmp/wimi-site
      - name: Smoke check output
        run: |
          set -euo pipefail
          test -f /tmp/wimi-site/index.html
          test -d /tmp/wimi-site/posts
          test -d /tmp/wimi-site/photos
          # The home page is text only; the photo surface begins at /photos.
          grep -q 'surface-paper' /tmp/wimi-site/index.html
          ! grep -q '<img' /tmp/wimi-site/index.html
          grep -q 'surface-photo' /tmp/wimi-site/photos/index.html
          grep -q 'album-card' /tmp/wimi-site/photos/index.html
          grep -q '/css/gallery' /tmp/wimi-site/photos/index.html
          ! grep -q '/js/gallery' /tmp/wimi-site/photos/index.html
          # Gallery interactions load only on photo detail.
          PHOTO_DETAIL=$(find /tmp/wimi-site/photos -mindepth 2 -name index.html | head -1)
          test -n "$PHOTO_DETAIL"
          grep -q 'photo-card' "$PHOTO_DETAIL"
          grep -q '/css/gallery' "$PHOTO_DETAIL"
          grep -q '/js/gallery' "$PHOTO_DETAIL"
          # Theme script sitewide
          grep -q '/js/theme' /tmp/wimi-site/index.html
          # Comments assets on guestbook when enabled
          grep -q '/js/comments' /tmp/wimi-site/guestbook/index.html
          echo "smoke ok"
