name: build

on:
  push:
  pull_request:

jobs:
  exampleSite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.166.0"
      - name: Build exampleSite
        run: hugo --source exampleSite --themesDir "$(dirname "$PWD")" --minify --destination /tmp/wimi-site
