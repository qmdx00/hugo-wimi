name: build

on:
  push:
  pull_request:

jobs:
  exampleSite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.166.0"
      - name: Build exampleSite
        run: hugo --source exampleSite --themesDir "$(dirname "$PWD")" --minify --destination /tmp/wimi-site
      - name: Smoke check output
        run: |
          set -euo pipefail
          test -f /tmp/wimi-site/index.html
          test -d /tmp/wimi-site/posts
          test -d /tmp/wimi-site/photos
          # Base CSS bundle always present
          grep -Rql 'wimi\.' /tmp/wimi-site/index.html
          # Gallery CSS/JS only on photo detail, not list
          PHOTO_DETAIL=$(find /tmp/wimi-site/photos -mindepth 2 -name index.html | head -1)
          test -n "$PHOTO_DETAIL"
          grep -q 'gallery' "$PHOTO_DETAIL"
          # Theme script sitewide
          grep -q 'theme' /tmp/wimi-site/index.html
          # Comments assets on guestbook when enabled
          grep -q 'comments' /tmp/wimi-site/guestbook/index.html
          echo "smoke ok"
