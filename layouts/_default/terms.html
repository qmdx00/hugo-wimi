{{ define "main" }}
<div class="reading-width listing-page">
  <header class="page-heading">
    <h1>{{ .Title }}</h1>
    {{ with .Content }}<div class="page-lead">{{ . }}</div>{{ else }}{{ with .Description }}<p class="page-lead">{{ . }}</p>{{ end }}{{ end }}
  </header>
  <ul class="term-list">
    {{ range .Pages.ByTitle }}
      <li><a href="{{ .RelPermalink }}">{{ .Title }}</a><span>{{ len .Pages }}</span></li>
    {{ end }}
  </ul>
</div>
{{ end }}
