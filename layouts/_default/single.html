{{ define "main" }}
<article class="article reading-width">
  {{ partial "article-header.html" . }}
  {{ if and .Params.toc (gt (len .TableOfContents) 0) }}
    <details class="toc"{{ if site.Params.article.tocOpen }} open{{ end }}>
      <summary>{{ site.Params.article.tocTitle | default "目录" }}</summary>
      {{ .TableOfContents }}
    </details>
  {{ end }}
  <div class="prose">{{ .Content }}</div>
</article>
{{ partial "comments.html" . }}
{{ end }}
