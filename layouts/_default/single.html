{{ define "main" }}
<article class="article reading-width paper-wrap">
  {{ partial "article-header.html" . }}
  {{ if and .Params.toc (gt (len .TableOfContents) 0) }}
    <details class="toc">
      <summary>{{ site.Params.article.tocTitle | default (i18n "toc") }}</summary>
      {{ .TableOfContents }}
    </details>
  {{ end }}
  <div class="prose">{{ .Content }}</div>
</article>
{{ partial "comments.html" . }}
{{ end }}
