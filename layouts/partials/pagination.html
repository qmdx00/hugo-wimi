{{ if gt .TotalPages 1 }}
  <nav class="pagination" aria-label="{{ i18n "pagination" }}">
    {{ with .Prev }}<a href="{{ .URL }}" rel="prev">← {{ i18n "prevPage" }}</a>{{ else }}<span></span>{{ end }}
    <span>{{ .PageNumber }} / {{ .TotalPages }}</span>
    {{ with .Next }}<a href="{{ .URL }}" rel="next">{{ i18n "nextPage" }} →</a>{{ else }}<span></span>{{ end }}
  </nav>
{{ end }}
