baseURL = 'http://localhost:1314/'
defaultContentLanguage = 'zh'
locale = 'zh-CN'
hasCJKLanguage = true
title = 'Wimi 的个人空间'
theme = 'hugo-wimi'
copyright = 'Wimi'

[pagination]
  pagerSize = 10

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[taxonomies]
  category = 'categories'
  tag = 'tags'

[params]
  brand = 'wimi'
  author = 'Wimi'
  description = '关于技术、生活和那些值得记录的瞬间。'
  dateFormat = '2006/01/02'
  footer = '用 Hugo 构建，安静地写作。'
  # system | light | dark — initial preference; visitors can cycle via the header toggle
  colorMode = 'dark'
  # Optional absolute or site-relative image used when a page has no cover/photo
  # ogImage = '/og-default.png'

  [params.home]
    heading = 'Wimi'
    intro = '写一点东西，偶尔拍照。'
    recentPosts = 8
    [[params.home.links]]
      name = 'GitHub'
      url = 'https://github.com/'

  [params.article]
    tocOpen = true
    tocTitle = '目录'
    showAuthor = true
    showTaxonomies = true

  # Demo only — wire Pages Functions + D1 + Turnstile + Access for production
  [params.comments]
    enabled = true
    apiBase = '/api/comments'
    turnstileSiteKey = ''

  [params.photos]
    baseURL = 'https://picsum.photos/'

[[menu.main]]
  name = '首页'
  pageRef = '/'
  weight = 10
[[menu.main]]
  name = '相册'
  pageRef = '/photos'
  weight = 20
[[menu.main]]
  name = '文章'
  pageRef = '/posts'
  weight = 30
[[menu.main]]
  name = '留言'
  pageRef = '/guestbook'
  weight = 40
